name: Crear sm64.wasm
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/libsm64/libsm64.git
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
      - run: |
          source ./emsdk/emsdk_env.sh
          cd libsm64
          python3 import-mario-geo.py
          SRCS=$(ls src/*.c src/decomp/*.c src/decomp/engine/*.c src/decomp/include/PR/*.c src/decomp/game/*.c src/decomp/pc/*.c src/decomp/pc/audio/*.c src/decomp/mario/*.c src/decomp/tools/*.c src/decomp/audio/*.c 2>/dev/null)
          FUNCS=$(grep -oE 'sm64_[a-z0-9_]+\(' src/libsm64.h | tr -d '(' | sort -u | sed 's/^/_/' | paste -sd, -)
          emcc -O2 -fno-strict-aliasing -Wno-unused-function -DSM64_LIB_EXPORT -DGBI_FLOATS -DVERSION_US -DNO_SEGMENTED_MEMORY -I src/decomp/include $SRCS -o sm64.wasm --no-entry -sSTANDALONE_WASM -sALLOW_MEMORY_GROWTH -sINITIAL_MEMORY=134217728 -sSTACK_SIZE=1048576 -sERROR_ON_UNDEFINED_SYMBOLS=0 "-sEXPORTED_FUNCTIONS=_malloc,_free,$FUNCS"
      - uses: actions/upload-artifact@v4
        with:
          name: sm64-wasm
          path: libsm64/sm64.wasm
